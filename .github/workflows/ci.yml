name: CI (Backend + Android)

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Hủy lần chạy cũ khi có commit mới trên cùng nhánh
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Giá trị dùng chung. Đây là bí mật CHỈ dành cho CI (DB tạm, bị xóa sau mỗi lần chạy).
env:
  DB_PASSWORD: matkhau123
  JWT_SECRET: ci-only-jwt-secret-key-at-least-32-characters-long

jobs:
  # Job 1: test backend (giống backend-ci.yml)
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: truyenapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cho phép chạy mvnw
        run: chmod +x mvnw

      - name: Build và test
        run: ./mvnw -B clean test

      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: truyenapi/target/surefire-reports

  # Job 2: unit test app Android (chạy trên JVM, nhanh)
  android-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cho phép chạy gradlew
        run: chmod +x gradlew

      - name: Chạy unit test
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lưu báo cáo unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android_app/app/build/reports/tests/testDebugUnitTest

  # Job 3: UI test tích hợp. PostgreSQL + backend thật chạy trên runner,
  # app trong emulator gọi backend qua http://10.0.2.2:8080
  integration-ui-test:
    runs-on: ubuntu-latest
    needs: [backend-test, android-unit-test]
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: truyendb
          POSTGRES_USER: truyen
          POSTGRES_PASSWORD: matkhau123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truyen -d truyendb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # setup-java chỉ cache được một loại, nên Gradle dùng setup-java, Maven dùng actions/cache
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('truyenapi/pom.xml') }}
          restore-keys: maven-

      # --- Khởi động backend ---
      - name: Build backend (bỏ qua test vì đã chạy ở job backend-test)
        working-directory: truyenapi
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Chạy backend nền
        working-directory: truyenapi
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' ! -name '*.original' | head -n 1)
          echo "Chạy $JAR"
          nohup java -jar "$JAR" > "$GITHUB_WORKSPACE/backend.log" 2>&1 &

      - name: Đợi backend sẵn sàng
        run: |
          for i in $(seq 1 60); do
            # /error là đường dẫn công khai; chỉ cần server trả lời (mã khác 000) là backend đã lên
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/error || true)
            if [ "$code" != "000" ]; then
              echo "Backend sẵn sàng (HTTP $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend không khởi động được. 100 dòng log cuối:"
          tail -n 100 backend.log
          exit 1

      # Tùy chọn: nạp dữ liệu mẫu (truyện, chương) cho UI test. Bỏ qua nếu chưa có file.
      # Chạy sau khi backend lên vì ddl-auto=update chỉ tạo bảng lúc backend khởi động.
      - name: Nạp dữ liệu mẫu
        if: hashFiles('deploy/seed-test.sql') != ''
        run: PGPASSWORD="$DB_PASSWORD" psql -h localhost -U truyen -d truyendb -f deploy/seed-test.sql

      # --- Chạy UI test trên emulator ---
      - name: Cho phép chạy gradlew
        working-directory: android_app
        run: chmod +x gradlew

      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Chạy UI test trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android_app
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.baseUrl=http://10.0.2.2:8080/

      # --- Lưu kết quả ---
      - name: Lưu báo cáo UI test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: android_app/app/build/reports/androidTests

      - name: Lưu log backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
