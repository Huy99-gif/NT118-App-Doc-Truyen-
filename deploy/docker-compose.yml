services:
  db:
    image: postgres:16
    container_name: truyen-db
    environment:
      POSTGRES_USER: truyen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-truyen}
      POSTGRES_DB: truyendb
    ports:
      - "5432:5432"
    volumes:
      - truyen_pgdata:/var/lib/postgresql/data

volumes:
  truyen_pgdata: