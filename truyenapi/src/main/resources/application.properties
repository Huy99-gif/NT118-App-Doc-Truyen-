spring.application.name=truyenapi
spring.datasource.url=jdbc:postgresql://localhost:5432/truyendb
spring.datasource.username=truyen
spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=${DB_PASSWORD:matkhau123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
spring.config.import=optional:file:./secrets.properties,optional:file:./truyenapi/secrets.properties


spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}
app.reset-token.expiry-minutes=15
app.jwt.expiration-ms=86400000
